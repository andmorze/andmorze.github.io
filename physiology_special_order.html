                --accent-2: #80cbc4;
                --btn-bg: #262b31;
                --btn-border: #3a4048;
                --btn-hover: #313842;
                --img-bg: #1c1f24;
            }

            --border: #d0d7e2;

            --btn-border: #c9d4e3;

        }

            color: var(--text);

            padding: 20px;
        }

        h1 {
            font-size: 1.4em;

        }

        /* --- Панель управления темой --- */
        #theme-bar {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 100;
            display: flex;
            gap: 6px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px;
            box-shadow: var(--shadow);
        }

            #theme-bar button {
                border: 1px solid var(--btn-border);
                background: var(--btn-bg);
                color: var(--text);
                border-radius: 6px;
                padding: 6px 10px;
                font-size: .85em;
                cursor: pointer;
                transition: .15s;
            }

                #theme-bar button:hover {
                    background: var(--btn-hover);
                    border-color: var(--accent-2);
                }

                #theme-bar button.active {
                    border-color: var(--accent-2);
                    font-weight: bold;
                    background: var(--btn-hover);
                }

        .topic {
            margin: 28px 0 8px;
            padding: 10px 14px;
            border-radius: 8px;
            background: var(--panel);
            box-shadow: var(--shadow);
            border-left: 6px solid var(--accent-1);
            transition: background .2s;
        }

            .topic h2 {
                margin: 0;
                font-size: 1.2em;
                color: var(--accent-1);
            }

        .test {
            margin: 16px 0 8px 12px;
            padding: 8px 12px;
            border-radius: 6px;
            background: var(--panel);
            border-left: 5px solid var(--accent-2);
            transition: background .2s;
        }

            .test h3 {
                margin: 0;
                font-size: 1.05em;
                color: var(--accent-2);
            }

        .subgroup {
            margin: 12px 0 8px 24px;
        }

        .subgroup-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .question {
            margin: 12px 0 16px 24px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel);
            color: var(--text);
            transition: background .2s, border-color .2s;
        }

        .q-text {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .q-image {
            text-align: center;
            margin: 10px 0;
        }

            .q-image img {
                max-width: 100%;
                border: 1px solid var(--border);
                border-radius: 6px;
                background: var(--img-bg);
            }

        .options {

            padding: 0;
            margin: 0;
        }

            .options li {
                padding: 8px 10px;
                margin: 6px 0;
                border: 1px solid var(--border);

                background: var(--answer-bg);
                color: var(--text);
                transition: background .2s, border-color .2s, color .2s;

                .options li.correct {
                    background: var(--answer-correct-bg);
                    border-color: var(--answer-correct-border);
                    color: var(--answer-correct-text);
                    font-weight: bold;
                }

        .marker {
            display: inline-block;
            width: 16px;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            #theme-bar {
                top: 8px;
                right: 8px;
            }

                    padding: 4px 8px;
                    font-size: .8em;
                }
        }
    </style>
</head>

        const out = document.getElementById('out');

        /* ---------- Тема ---------- */
        const THEME_KEY = 'physiology-viewer-theme'; // 'auto' | 'light' | 'dark'
        const root = document.documentElement;

        function applyTheme(theme) {
            if (theme === 'light' || theme === 'dark') {
                root.setAttribute('data-theme', theme);
            } else {
                root.removeAttribute('data-theme');
            }
            document.querySelectorAll('[data-theme-btn]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.themeBtn === theme);
            });
        }

        function initTheme() {
            let saved = null;
            try { saved = localStorage.getItem(THEME_KEY); } catch (_) { }
            const theme = (saved === 'light' || saved === 'dark') ? saved : 'auto';
            applyTheme(theme);
        }

        document.querySelectorAll('[data-theme-btn]').forEach(btn => {
            btn.addEventListener('click', () => {
                const theme = btn.dataset.themeBtn;
                applyTheme(theme);
                try { localStorage.setItem(THEME_KEY, theme); } catch (_) { }
            });
        });

        initTheme();

        /* ---------- Рендер ---------- */
        function renderQuestion(q) {
            const wrap = document.createElement('div');
            wrap.className = 'question';

            const text = document.createElement('div');
            text.className = 'q-text';
            text.textContent = q.text || '';
            wrap.appendChild(text);

            if (q.image) {
                const imgBox = document.createElement('div');
                imgBox.className = 'q-image';
                const img = document.createElement('img');
                img.src = q.image;
                img.alt = q.text || 'изображение';
                img.loading = 'lazy';
                imgBox.appendChild(img);
                wrap.appendChild(imgBox);
            }

            const ul = document.createElement('ul');
            ul.className = 'options';
            (q.options || []).forEach(opt => {
                const li = document.createElement('li');
                const mk = document.createElement('span');
                mk.className = 'marker';
                if (opt.correct) {
                    li.classList.add('correct');
                    mk.textContent = '✓';
                }
                li.appendChild(mk);
                li.appendChild(document.createTextNode(opt.text || ''));
                ul.appendChild(li);
            });
            wrap.appendChild(ul);
            return wrap;
        }

        function renderTest(testName, testObj) {
            const testBox = document.createElement('div');
            testBox.className = 'test';
            const h3 = document.createElement('h3');
            h3.textContent = testName;
            testBox.appendChild(h3);

            (testObj.subgroups || []).forEach((sg, sgIdx) => {
                const sgBox = document.createElement('div');
                sgBox.className = 'subgroup';
                const sgTitle = document.createElement('div');
                sgTitle.className = 'subgroup-title';
                sgTitle.textContent =
                    `Вопрос ${sg.title != null ? sg.title : sgIdx + 1} — ${sg.questions.length} вариаций`;
                sgBox.appendChild(sgTitle);
                sg.questions.forEach(q => sgBox.appendChild(renderQuestion(q)));
                testBox.appendChild(sgBox);
            });

            return testBox;
        }

        function render() {
            const frag = document.createDocumentFragment();
            Object.keys(testData.sections).forEach(topicName => {
                const topicData = testData.sections[topicName];

                const topicBox = document.createElement('div');
                topicBox.className = 'topic';
                const h2 = document.createElement('h2');
                h2.textContent = topicName;
                topicBox.appendChild(h2);
                frag.appendChild(topicBox);

                Object.keys(topicData.tests).forEach(testName => {
                    topicBox.appendChild(renderTest(testName, topicData.tests[testName]));
                });
            });
            out.innerHTML = '';
            out.appendChild(frag);
        }

        render();
