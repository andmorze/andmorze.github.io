<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>respiratory</title>
<style>
    :root {
        --bg: #f7f9fc;
        --panel: #ffffff;
        --text: #1a1a1a;
        --text-muted: #555555;
        --border: #d0d7e2;
        --border-soft: #e6e6e6;
        --btn-bg: #ffffff;
        --btn-hover: #eef4ff;
        --btn-border: #c9d4e3;
        --btn-primary: #1976d2;
        --btn-primary-hover: #1565c0;
        --btn-secondary: #78909c;
        --btn-secondary-hover: #546e7a;
        --btn-back: #f0f0f0;
        --input-section-bg: #fff4f4;
        --input-section-border: #e4bcbc;
        --output-section-bg: #f3f7ff;
        --output-section-border: #bdcce5;
        --answer-bg: #ffffff;
        --answer-hover: #f0f6ff;
        --answer-correct-bg: #e8f5e9;
        --answer-correct-border: #66bb6a;
        --answer-correct-text: #1b5e20;
        --answer-incorrect-bg: #ffebee;
        --answer-incorrect-border: #ef5350;
        --answer-incorrect-text: #b71c1c;
        --progress-bg: #e0e0e0;
        --progress-fill: #4caf50;
        --qlist-bg: #fafafa;
        --qlist-current-bg: #e8f5e9;
        --shadow: 0 2px 10px rgba(0,0,0,.06);
        --shadow-header: 0 2px 6px rgba(0,0,0,.08);
        --img-bg: #ffffff;
        --accent-1: #6a4c93;
        --accent-2: #2a9d8f;
        --grade-5: #2e7d32;
        --grade-4: #558b2f;
        --grade-3: #ef6c00;
        --grade-2: #c62828;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #121417;
            --panel: #1c1f24;
            --text: #f1f3f5;
            --text-muted: #b0b6bd;
            --border: #3a4048;
            --border-soft: #2b3037;
            --btn-bg: #262b31;
            --btn-hover: #313842;
            --btn-border: #3a4048;
            --btn-primary: #2b8ae0;
            --btn-primary-hover: #3d9bef;
            --btn-secondary: #4b555f;
            --btn-secondary-hover: #5a6570;
            --btn-back: #262b31;
            --input-section-bg: #2a2224;
            --input-section-border: #5a3f3f;
            --output-section-bg: #1f2530;
            --output-section-border: #3a4a63;
            --answer-bg: #23272d;
            --answer-hover: #2b323a;
            --answer-correct-bg: #1e3a22;
            --answer-correct-border: #4caf50;
            --answer-correct-text: #a5e0a8;
            --answer-incorrect-bg: #3a1f22;
            --answer-incorrect-border: #ef5350;
            --answer-incorrect-text: #ffb3b3;
            --progress-bg: #2b3037;
            --progress-fill: #4caf50;
            --qlist-bg: #23272d;
            --qlist-current-bg: #1e3a22;
            --shadow: 0 2px 12px rgba(0,0,0,.5);
            --shadow-header: 0 2px 8px rgba(0,0,0,.5);
            --img-bg: #1c1f24;
            --accent-1: #b39ddb;
            --accent-2: #80cbc4;
            --grade-5: #81c784;
            --grade-4: #aed581;
            --grade-3: #ffb74d;
            --grade-2: #ef9a9a;
        }
    }

    * { box-sizing: border-box; }

    html, body {
        background: var(--bg);
        color: var(--text);
        color-scheme: light dark;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding-top: 70px;
        transition: background .2s, color .2s;
    }

    .hidden { display: none !important; }

    #header {
        position: fixed;
        top: 0; left: 0; right: 0;
        background: var(--panel);
        color: var(--text);
        z-index: 1000;
        box-shadow: var(--shadow-header);
        padding: 12px 0;
        text-align: center;
    }
    #header h1 { margin: 0; font-size: 1.5em; color: var(--text); }

    #menu {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        padding: 20px;
        max-width: 900px;
        margin: 0 auto;
    }
    #menu button {
        padding: 14px 10px;
        font-size: .95em;
        cursor: pointer;
        border: 1px solid var(--btn-border);
        border-radius: 8px;
        background: var(--btn-bg);
        color: var(--text);
        transition: .15s;
    }
    #menu button:hover:not(:disabled) {
        background: var(--btn-hover);
        border-color: var(--btn-primary);
    }
    #menu button:disabled {
        opacity: .5;
        cursor: not-allowed;
    }
    #menu button.input-section {
        background: var(--input-section-bg);
        border-color: var(--input-section-border);
    }
    #menu button.output-section {
        background: var(--output-section-bg);
        border-color: var(--output-section-border);
    }
    #menu button.menu-back {
        grid-column: 1 / -1;
        background: var(--btn-back);
    }

    #menu button.master-btn {
        grid-column: 1 / -1;
        padding: 16px 14px;
        font-size: 1.02em;
        font-weight: 700;
        text-align: left;
        border-radius: 10px;
        transition: .15s;
    }
    #menu button.master-btn.all-questions {
        background: linear-gradient(135deg, var(--input-section-bg) 0%, var(--btn-bg) 100%);
        border-color: var(--input-section-border);
        border-left: 5px solid var(--accent-1);
    }
    #menu button.master-btn.all-questions:hover:not(:disabled) {
        background: var(--btn-hover);
        border-color: var(--accent-1);
    }
    #menu button.master-btn.random-test {
        background: linear-gradient(135deg, var(--output-section-bg) 0%, var(--btn-bg) 100%);
        border-color: var(--output-section-border);
        border-left: 5px solid var(--accent-2);
    }
    #menu button.master-btn.random-test:hover:not(:disabled) {
        background: var(--btn-hover);
        border-color: var(--accent-2);
    }

    #menu .menu-level-title {
        grid-column: 1 / -1;
        text-align: center;
        font-size: 1.15em;
        font-weight: 700;
        color: var(--text);
        padding: 4px 0 10px;
        border-bottom: 1px dashed var(--border);
        margin-bottom: 4px;
    }

    #quiz, #result {
        max-width: 900px;
        margin: 20px auto;
        padding: 20px;
        background: var(--panel);
        color: var(--text);
        border-radius: 12px;
        box-shadow: var(--shadow);
    }

    #progress-wrapper {
        max-width: 900px;
        margin: 0 auto;
        padding: 10px 20px 0;
    }
    #progress-container { display: flex; align-items: center; }
    #progress-bar-container {
        flex: 1;
        background: var(--progress-bg);
        border-radius: 5px;
        height: 10px;
        overflow: hidden;
    }
    #progress-bar {
        height: 100%;
        width: 0%;
        background: var(--progress-fill);
        border-radius: 5px;
        transition: width .3s;
    }
    #progress-text {
        margin-left: 10px;
        font-weight: bold;
        color: var(--text);
    }

    #question-jump { margin: 0 0 15px; }
    #question-jump summary {
        cursor: pointer;
        font-weight: bold;
        font-size: 1.05em;
        color: var(--text);
    }
    #question-list {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        padding: 15px 0;
    }
    #question-list button {
        padding: 8px 4px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--qlist-bg);
        color: var(--text);
        cursor: pointer;
    }
    #question-list button:hover { background: var(--btn-hover); }
    #question-list button.current-question {
        outline: 2px solid var(--progress-fill);
        font-weight: bold;
        background: var(--qlist-current-bg);
    }

    .question-text {
        margin-bottom: 12px;
        font-size: 1.05em;
        color: var(--text);
    }

    .question-image {
        margin: 14px 0;
        text-align: center;
    }
    .question-image img {
        max-width: 100%;
        height: auto;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--img-bg);
    }

    .answers {
        list-style: none;
        padding: 0;
        margin: 0;
    }
    .answers li {
        margin: 8px 0;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: .12s;
        background: var(--answer-bg);
        color: var(--text);
    }
    .answers li:hover { background: var(--answer-hover); }
    .answers li label {
        cursor: pointer;
        color: inherit;
        flex: 1;
    }
    .answers li.correct {
        color: var(--answer-correct-text);
        background: var(--answer-correct-bg);
        border-color: var(--answer-correct-border);
        font-weight: bold;
    }
    .answers li.incorrect {
        color: var(--answer-incorrect-text);
        background: var(--answer-incorrect-bg);
        border-color: var(--answer-incorrect-border);
        font-weight: bold;
    }
    .answers input[type="radio"] { margin-right: 6px; }

    button {
        margin-top: 10px;
        padding: 10px 16px;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        background: var(--btn-primary);
        color: #fff;
        font-size: .95em;
        transition: .15s;
    }
    button:hover:not(:disabled) { background: var(--btn-primary-hover); }
    button:disabled { background: #b0bec5; cursor: default; color: #444; }

    #menu-btn, #menu-btn2 {
        background: var(--btn-secondary);
        color: #fff;
    }
    #menu-btn:hover, #menu-btn2:hover {
        background: var(--btn-secondary-hover);
    }

    #feedback {
        margin-top: 12px;
        font-weight: bold;
        min-height: 1.4em;
        color: var(--text);
    }

    #score {
        font-size: 1.2em;
        font-weight: bold;
        margin-bottom: 10px;
        color: var(--text);
    }
    #grade-message {
        text-align: center;
        font-size: 1.35em;
        font-weight: bold;
        margin-top: 16px;
        padding: 14px;
        border-radius: 10px;
        background: var(--btn-hover);
        border: 1px solid var(--border);
        color: var(--text);
    }
    #grade-message .grade-num {
        display: inline-block;
        font-size: 1.5em;
        margin-right: 8px;
    }
    #grade-message.grade-5 { color: var(--grade-5); border-color: var(--grade-5); }
    #grade-message.grade-4 { color: var(--grade-4); border-color: var(--grade-4); }
    #grade-message.grade-3 { color: var(--grade-3); border-color: var(--grade-3); }
    #grade-message.grade-2 { color: var(--grade-2); border-color: var(--grade-2); }

    #section-title, #result h2, #quiz h2 {
        color: var(--text);
    }

    @media (max-width: 600px) {
        #menu { grid-template-columns: repeat(2, 1fr); }
        #question-list { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 600px) {
        #header {
            display: none;
        }

        body {
            padding-top: 0;
        }
    }
</style>
</head>
<body>
<header id="header">
    <h1>Дыхательная, кожа, мочеполовая</h1>
</header>

<main>
    <div id="progress-wrapper" class="hidden">
        <div id="progress-container">
            <div id="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
            <span id="progress-text">0/0</span>
        </div>
    </div>

    <div id="menu-container">
        <div id="menu"></div>
    </div>

    <div id="quiz" class="hidden">
        <h2 id="section-title"></h2>
        <details id="question-jump">
            <summary>Список вопросов</summary>
            <div id="question-list"></div>
        </details>
        <div id="question-container">
            <div id="question-text" class="question-text"></div>
            <div id="question-image-container" class="question-image hidden"></div>
            <ul id="answers" class="answers"></ul>
            <div id="feedback"></div>
            <button id="check-btn">Проверить</button>
            <button id="next-btn" class="hidden">Следующий вопрос</button>
            <button id="finish-btn" class="hidden">Завершить тест</button>
            <button id="menu-btn">Вернуться в меню</button>
        </div>
    </div>

    <div id="result" class="hidden">
        <h2>Результат</h2>
        <div id="score"></div>
        <div id="grade-message"></div>
        <button id="retry-btn">Пройти заново</button>
        <button id="menu-btn2">Вернуться в меню</button>
    </div>
</main>

            const section = testData.sections[sectionName];
            (section.questions || []).forEach((q, idx) => {
            all.push({
                ...q,
                _section: sectionName,
                _key: `${sectionName}#${q.num ?? idx}`
            });
            });
        });
        return all;
    }

            function getConfig() {
                // Конфиг берём строго из JSON. Секция одна — её config и есть конфиг теста.
                for (const name of Object.keys(testData.sections)) {
                    const s = testData.sections[name];
                    if ((s.questions || []).length > 0 && s.config) {

        const a = arr.slice();

        [a[i], a[j]] = [a[j], a[i]];
        }
        return a;

                randomBtn.addEventListener("click", () => {
                    startQuiz(
                        makeRandomTest(),
                        `Случайный тест (${QUIZ_SIZE} вопросов)`,
                        getConfig(),
                        makeRandomTest
                    );
                });
                els.menu.appendChild(randomBtn);
            }

            /* ---------- СТАРТ ТЕСТА ---------- */
            function startQuiz(questions, title, config, generator) {
                state.currentQuestions = questions;
            state.currentTitle = title;
            state.currentConfig = config || null;
            state.generator = generator || null;
            state.currentIndex = 0;
            state.answers = new Array(questions.length).fill(null);
            state.checked = false;
            state.errorState = false;

            els.menuContainer.classList.add("hidden");
            els.quiz.classList.remove("hidden");
            els.result.classList.add("hidden");
            els.progressWrapper.classList.remove("hidden");
            els.gradeMessage.className = "";
            els.gradeMessage.textContent = "";

            els.sectionTitle.textContent = title;

            if (!questions || questions.length === 0) {
                state.errorState = true;
            els.questionText.textContent = ERROR_MESSAGE;
            els.questionImageContainer.innerHTML = "";
            els.answers.innerHTML = "";
            els.feedback.textContent = "";
            els.checkBtn.classList.add("hidden");
            els.nextBtn.classList.add("hidden");
            els.finishBtn.classList.add("hidden");
            els.progressBar.style.width = "0%";
            els.progressText.textContent = "0/0";
            return;
        }

            renderQuestionList();
            renderQuestion();
            updateProgress();
    }

            /* ---------- СПИСОК ВОПРОСОВ ---------- */
            function renderQuestionList() {
                els.questionList.innerHTML = "";
        state.currentQuestions.forEach((_, i) => {
            const btn = document.createElement("button");
            btn.textContent = i + 1;

            if (i === state.currentIndex) btn.classList.add("current-question");

            if (state.answers[i] !== null) {
                btn.style.borderColor = "var(--answer-correct-border)";
            btn.style.fontWeight = "bold";
            }

            btn.addEventListener("click", () => {
                if (state.errorState) return;
            state.currentIndex = i;
            renderQuestion();
            renderQuestionList();
            updateProgress();
            });
            els.questionList.appendChild(btn);
        });
    }

            /* ---------- РЕНДЕР ВОПРОСА ---------- */
            function renderQuestion() {
        if (state.errorState) {
                els.questionText.textContent = ERROR_MESSAGE;
            els.questionImageContainer.innerHTML = "";
            els.answers.innerHTML = "";
            els.feedback.textContent = "";
            els.checkBtn.classList.add("hidden");
            els.nextBtn.classList.add("hidden");
            els.finishBtn.classList.add("hidden");
            return;
        }

            const q = state.currentQuestions[state.currentIndex];
            const multi = isMultiple(q);
            const userAnswer = state.answers[state.currentIndex]; // Set|null
            const hasBeenAnswered = userAnswer !== null;

            state.checked = hasBeenAnswered;

            els.questionText.textContent = multi
            ? q.text + "  (выберите все верные варианты)"
            : q.text;
            els.feedback.textContent = "";
            els.feedback.style.color = "";

            // Изображение
            els.questionImageContainer.innerHTML = "";
            if (q.image) {
                els.questionImageContainer.classList.remove("hidden");
            const img = document.createElement("img");
            img.src = q.image;
            img.alt = q.text;
            img.onerror = function () {
                this.alt = "Не удалось загрузить изображение";
            this.style.minHeight = "80px";
            this.style.background = "var(--img-bg)";
            };
            els.questionImageContainer.appendChild(img);
        } else {
                els.questionImageContainer.classList.add("hidden");
        }

            // Варианты
            els.answers.innerHTML = "";
        q.options.forEach((opt, idx) => {
            const li = document.createElement("li");
            const input = document.createElement("input");
            input.type = multi ? "checkbox" : "radio";
            input.name = "answer";
            input.value = idx;
            input.id = "opt-" + idx;
            const label = document.createElement("label");
            label.htmlFor = "opt-" + idx;
            label.textContent = opt.text;
            li.appendChild(input);
            li.appendChild(label);

            if (hasBeenAnswered) {
                // ФИНАЛЬНОЕ СОСТОЯНИЕ — менять нельзя
                input.checked = userAnswer.has(idx);
            input.disabled = true;
            li.style.cursor = "default";

            if (opt.correct) li.classList.add("correct");
            if (userAnswer.has(idx) && !opt.correct) li.classList.add("incorrect");
            } else {
                // АКТИВНОЕ — клик навешивается только сейчас,
                // после проверки обработчика на li не будет вовсе.
                // (фикс бага «Следующий срабатывает как Проверить»)
                li.addEventListener("click", (e) => {
                    if (state.answers[state.currentIndex] !== null) return;
                    if (e.target.tagName !== "INPUT") {
                        input.checked = multi ? !input.checked : true;
                    }
                    if (!state.answers[state.currentIndex]) {
                        state.answers[state.currentIndex] = new Set();
                    }
                    const set = state.answers[state.currentIndex];
                    if (multi) {
                        if (input.checked) set.add(idx);
                        else set.delete(idx);
                        // если всё снял — снова null, чтобы «Проверить» требовал выбор
                        if (set.size === 0) state.answers[state.currentIndex] = null;
                    } else {
                        set.clear();
                        set.add(idx);
                        els.answers.querySelectorAll('input[type="radio"]').forEach(r => {
                            if (r !== input) r.checked = false;
                        });
                    }
                });
            }

            els.answers.appendChild(li);
        });

            // Кнопка «Проверить» / фидбэк
            if (hasBeenAnswered) {
                els.checkBtn.classList.add("hidden");
            const correctSet = correctSetOf(q);
            if (setsEqual(userAnswer, correctSet)) {
                els.feedback.textContent = "✅ Верно!";
            els.feedback.style.color = "var(--answer-correct-text)";
            } else {
                const correctTexts = q.options
                    .filter(o => o.correct)
                    .map(o => "«" + o.text + "»")
            .join(", ");
            els.feedback.textContent = "❌ Неверно. Правильные: " + correctTexts;
            els.feedback.style.color = "var(--answer-incorrect-text)";
            }
        } else {
                els.checkBtn.classList.remove("hidden");
            els.checkBtn.disabled = false;
            els.checkBtn.onclick = () => {
                const cur = state.answers[state.currentIndex];
            if (cur === null || cur.size === 0) {
                els.feedback.textContent = "Выберите вариант(ы) ответа.";
            els.feedback.style.color = "var(--answer-incorrect-text)";
            return;
                }
            checkAnswer();
            };
        }

            updateNavButtons();
            updateProgress();
    }

            /* ---------- НАВИГАЦИЯ ---------- */
            function updateNavButtons() {
        const allAnswered = state.answers.every(a => a !== null);
            const isLast = state.currentIndex === state.currentQuestions.length - 1;

            els.nextBtn.classList.add("hidden");
            els.finishBtn.classList.add("hidden");

            if (!allAnswered) {
            if (!isLast) {
                // «Следующий» — только после проверки; не вызывает checkAnswer
                if (state.answers[state.currentIndex] !== null) {
                els.nextBtn.classList.remove("hidden");
                    els.nextBtn.onclick = () => {
                state.currentIndex++;
            renderQuestion();
            renderQuestionList();
            updateProgress();
                    };
                }
            } else {
                if (state.answers[state.currentIndex] !== null) {
                els.feedback.textContent = "Ответьте на все вопросы, чтобы завершить тест. Вернуться можно через «Список вопросов».";
            els.feedback.style.color = "var(--answer-incorrect-text)";
                }
            }
        } else {
            if (!isLast) {
                els.nextBtn.classList.remove("hidden");
                els.nextBtn.onclick = () => {
                state.currentIndex++;
            renderQuestion();
            renderQuestionList();
            updateProgress();
                };
            }
            els.finishBtn.classList.remove("hidden");
            els.finishBtn.onclick = () => {
                if (state.errorState) return;
            finishQuiz(false);
            };
        }
    }

            /* ---------- ПРОВЕРКА ---------- */
            function checkAnswer() {
        const q = state.currentQuestions[state.currentIndex];
            const userAnswer = state.answers[state.currentIndex];
            if (userAnswer === null || userAnswer.size === 0) return;

            state.checked = true;

            // фиксируем верность ответа (пригодится для finishQuiz)
            // сам факт «отвечено» уже выражен тем, что answers[i] !== null

            renderQuestion();        // перерисовка в финальном виде (disabled+подсветка)
            renderQuestionList();
            updateNavButtons();
    }

            function updateProgress() {
        const total = state.currentQuestions.length;
            const current = state.currentIndex + 1;
        const pct = total > 0 ? (current / total) * 100 : 0;
            els.progressBar.style.width = pct + "%";
        els.progressText.textContent = total > 0 ? `${current} / ${total}` : "0 / 0";
    }

            /* ---------- ОЦЕНКА И РЕЗУЛЬТАТ ---------- */
            function evaluateGrade(pct, cfg) {
                const c = cfg || {};
                if (typeof c.percentFor5 === "number" && pct >= c.percentFor5) return { grade: 5, text: "Молодец, ступай мести полы, нейрон эфферентный." };
                if (typeof c.percentFor4 === "number" && pct >= c.percentFor4) return { grade: 4, text: "Зачёт с натяжкой, но сначала..." };
                if (typeof c.percentFor3 === "number" && pct >= c.percentFor3) return { grade: 3, text: "Золотце ты мое, порог за тобой." };
                return { grade: 2, text: "  Учи, макрофаг" };
            }

            function finishQuiz(force) {
        if (state.errorState) {backToMenu("main"); return; }

        if (!force && !state.answers.every(a => a !== null)) {
                alert("Ответьте на все вопросы перед завершением теста.");
            return;
        }

            let correct = 0;
        state.currentQuestions.forEach((q, i) => {
            const ans = state.answers[i];
            if (ans !== null && setsEqual(ans, correctSetOf(q))) correct++;
        });

            const total = state.currentQuestions.length;
        const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
            const result = evaluateGrade(pct, state.currentConfig);

            els.quiz.classList.add("hidden");
            els.progressWrapper.classList.add("hidden");
            els.result.classList.remove("hidden");

            els.score.textContent = `Правильных ответов: ${correct} из ${total} (${pct}%)`
            + (force ? " — завершено принудительно (Ctrl+M)" : "");

            els.gradeMessage.className = "grade-" + result.grade;
            els.gradeMessage.innerHTML =
            `<span class="grade-num">${result.grade}</span>${result.text}`;
    }

            /* ---------- НАВИГАЦИЯ МЕЖДУ ЭКРАНАМИ ---------- */
            function backToMenu() {
                els.quiz.classList.add("hidden");
            els.result.classList.add("hidden");
            els.progressWrapper.classList.add("hidden");
            els.menuContainer.classList.remove("hidden");
            state.errorState = false;
            renderMainMenu();
    }

    els.menuBtn.addEventListener("click", () => backToMenu());
    els.menuBtn2.addEventListener("click", () => backToMenu());
    if (els.menuBtn3) els.menuBtn3.addEventListener("click", () => backToMenu());

    // ФИКС БАГА №1: «Пройти заново» вызывает generator() — НОВАЯ выборка
    els.retryBtn.addEventListener("click", () => {
        if (state.generator) {
            const fresh = state.generator();
            startQuiz(fresh, state.currentTitle, state.currentConfig, state.generator);
        } else if (state.currentQuestions.length > 0) {
                // если тест был собран не генератором (на будущее), перезапускаем
                // с обнулением ответов, но ту же выборку
                startQuiz(state.currentQuestions, state.currentTitle, state.currentConfig, null);
        }
    });

    /* ---------- Ctrl+M (любая раскладка) ---------- */
    // ФИКС: e.code === "KeyM" — физическая клавиша, не зависит от раскладки.
    // capture: true — срабатывает раньше возможных перехватчиков.
    document.addEventListener("keydown", (e) => {
        const isM = (e.code === "KeyM") || (e.key && e.key.toLowerCase() === "m");
            if (!e.ctrlKey || e.altKey || e.metaKey || !isM) return;
            if (els.quiz.classList.contains("hidden")) return;

            e.preventDefault();
            e.stopPropagation();
            finishQuiz(true);
    }, true);

            /* ---------- СТАРТ ---------- */
            renderMainMenu();
})();
</script>
</body>
